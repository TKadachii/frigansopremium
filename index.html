<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friganso - Premium ERP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- PDF.js para leitura de PDFs offline -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- FIREBASE (Banco de Dados e Auth) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #f1f5f9; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .glass-dark { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // CONFIGURAÇÃO DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDaQ-WDQnGi-t5mCvL6rXAWLgO4gxW_j7Y",
            authDomain: "frigansoerm.firebaseapp.com",
            projectId: "frigansoerm",
            storageBucket: "frigansoerm.firebasestorage.app",
            messagingSenderId: "13332928407",
            appId: "1:13332928407:web:b3b51d1b825c560b9016d2",
            measurementId: "G-963SW3XSYM"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ICONS
        const IconUser = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const IconLock = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
        const IconDashboard = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>;
        const IconUsers = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        const IconFileText = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>;
        const IconReceipt = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg>;
        const IconWhatsApp = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>;
        const IconSupport = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>;
        const IconCode = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>;
        const IconLogOut = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;
        const IconPlus = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const IconMenu = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>;
        const IconCheck = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
        const IconMail = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>;
        const IconUpload = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
        const IconSearch = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
        const IconTag = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>;
        const IconLoader2 = () => <svg className="w-full h-full animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>;
        const IconX = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        const IconSettings = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
        const IconGoogle = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>;

        // UTILS
        const normalizeForSearch = (str) => {
            if (!str) return '';
            let s = str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); 
            s = s.replace(/\bcong\.?\b/g, "congelado").replace(/\b(resf|ref)\.?\b/g, "resfriado").replace(/[-_./]/g, " ").replace(/\s+/g, " ").trim();
            return s;
        };
        const parsePrice = (priceStr) => {
            if (!priceStr) return null;
            let cleanStr = priceStr.includes('.') && priceStr.includes(',') ? priceStr.replace(/\./g, '').replace(',', '.') : priceStr.replace(',', '.');
            const val = parseFloat(cleanStr); return isNaN(val) ? null : val;
        };
        const formatPrice = (value) => {
            if (value === null || value === undefined) return 'R$ 0,00';
            return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2 });
        };
        const checkDiscountRules = (code, name, originalPrice) => {
            const codeStr = (code || '').toString().trim(), nameStr = (name || '').toLowerCase().trim(), origPrice = parseFloat(originalPrice) || 0;
            let hasDiscount = true;
            if (codeStr.startsWith('16') || codeStr.startsWith('27') || codeStr.startsWith('90')) hasDiscount = false;
            if (nameStr.includes('fraldinha ramax')) hasDiscount = false;
            return { hasDiscount, origPrice, unitFinalPrice: hasDiscount ? Math.round((origPrice * 0.97) * 100) / 100 : origPrice };
        };

        const CustomMessageBox = ({ message, type = 'info', onClose }) => (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[100] animate-in fade-in">
                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 flex flex-col items-center text-center zoom-in-95 animate-in">
                    <div className={`h-16 w-16 rounded-full flex items-center justify-center mb-4 ${type === 'error' ? 'bg-red-100 text-red-600' : type === 'success' ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}`}>
                        {type === 'error' ? <IconX /> : <IconCheck />}
                    </div>
                    <h3 className="text-lg font-bold text-slate-800 mb-2">{type === 'error' ? 'Atenção' : type === 'success' ? 'Sucesso' : 'Aviso'}</h3>
                    <p className="text-slate-600 text-sm mb-6">{message}</p>
                    <button onClick={onClose} className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl transition-colors">Entendi</button>
                </div>
            </div>
        );

        // LOGIN SCREEN
        const LoginScreen = ({ onLogin, showMessage }) => {
            const [isRegistering, setIsRegistering] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [loginCode, setLoginCode] = useState('');
            const [password, setPassword] = useState('');
            const [regName, setRegName] = useState('');
            const [regCode, setRegCode] = useState('');
            const [regEmail, setRegEmail] = useState('');
            const [regPassword, setRegPassword] = useState('');
            const [pendingGoogleUser, setPendingGoogleUser] = useState(null);
            const [googleCode, setGoogleCode] = useState('');

            const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&.])[A-Za-z\d@$!%*#?&.]{6,}$/;

            const handleLogin = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                try {
                    const snapshot = await db.collection('users').where('code', '==', loginCode).where('password', '==', password).get();
                    if (!snapshot.empty) {
                        const userDoc = snapshot.docs[0].data();
                        if (userDoc.code === '99206' && userDoc.role !== 'admin') {
                            await db.collection('users').doc(snapshot.docs[0].id).update({ role: 'admin' });
                            userDoc.role = 'admin';
                        }
                        onLogin({ ...userDoc, id: snapshot.docs[0].id });
                    } else { showMessage('Código ou senha incorretos.', 'error'); }
                } catch(err) { showMessage('Erro de conexão com o banco.', 'error'); } finally { setIsLoading(false); }
            };

            const handleGoogleLoginOnly = async () => {
                setIsLoading(true);
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    const result = await auth.signInWithPopup(provider);
                    const snapshot = await db.collection('users').where('email', '==', result.user.email).get();
                    if (!snapshot.empty) {
                        onLogin({ ...snapshot.docs[0].data(), id: snapshot.docs[0].id });
                    } else {
                        showMessage('Conta não encontrada. Crie seu cadastro primeiro.', 'error');
                        auth.signOut();
                    }
                } catch (error) { showMessage(`Erro: ${error.message}`, 'error'); } finally { setIsLoading(false); }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                if (!passwordRegex.test(regPassword)) { showMessage('Senha fraca. Use letras, números e especiais.', 'error'); return; }
                setIsLoading(true);
                try {
                    const emailSnap = await db.collection('users').where('email', '==', regEmail).get();
                    if (!emailSnap.empty) { showMessage('Este e-mail já está em uso.', 'error'); setIsLoading(false); return; }
                    const codeSnap = await db.collection('users').where('code', '==', regCode).get();
                    if (!codeSnap.empty) { showMessage('Código já em uso.', 'error'); setIsLoading(false); return; }

                    const userRole = regCode === '99206' ? 'admin' : 'vendedor';
                    await db.collection('users').add({ name: regName, code: regCode, email: regEmail, password: regPassword, role: userRole, avatar: '' });
                    showMessage('Cadastro realizado com sucesso!', 'success');
                    setIsRegistering(false);
                } catch(err) { showMessage('Erro ao salvar.', 'error'); } finally { setIsLoading(false); }
            };

            const handleGoogleRegisterInit = async () => {
                setIsLoading(true);
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    const result = await auth.signInWithPopup(provider);
                    const snapshot = await db.collection('users').where('email', '==', result.user.email).get();
                    if (!snapshot.empty) { showMessage('Google já cadastrado. Faça login.', 'error'); auth.signOut(); } 
                    else { setPendingGoogleUser(result.user); }
                } catch (error) { showMessage(`Erro: ${error.message}`, 'error'); } finally { setIsLoading(false); }
            };

            const handleConfirmGoogleCode = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                try {
                    const codeSnap = await db.collection('users').where('code', '==', googleCode).get();
                    if (!codeSnap.empty) { showMessage('Código em uso.', 'error'); setIsLoading(false); return; }
                    const userRole = googleCode === '99206' ? 'admin' : 'vendedor';
                    const newUser = { name: pendingGoogleUser.displayName, code: googleCode, email: pendingGoogleUser.email, password: '', role: userRole, avatar: pendingGoogleUser.photoURL };
                    const docRef = await db.collection('users').add(newUser);
                    showMessage('Conta Google vinculada!', 'success');
                    onLogin({ ...newUser, id: docRef.id });
                } catch(err) { showMessage('Erro ao gravar.', 'error'); } finally { setIsLoading(false); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-900 relative overflow-hidden p-4">
                    <img src="image_c2642f.jpg" className="absolute inset-0 w-full h-full object-cover opacity-20" />
                    <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-rose-950/80 to-transparent"></div>
                    
                    <div className="w-full max-w-md p-8 glass rounded-3xl shadow-2xl relative z-10 border border-white/20 animate-in fade-in slide-in-from-bottom-4">
                        <div className="flex flex-col items-center mb-6">
                            <img src="image_c26485.png" alt="Friganso Logo" className="h-20 w-20 object-contain rounded-2xl bg-black/80 p-2 shadow-lg border border-rose-500/50 mb-4" />
                            <h1 className="text-3xl font-extrabold text-slate-800">Friganso<span className="text-rose-700">ERP</span></h1>
                            <p className="text-slate-500 text-sm mt-1">{isRegistering ? 'Crie sua conta de Vendedor' : 'Gestão Inteligente de Vendas'}</p>
                        </div>

                        {pendingGoogleUser ? (
                            <form onSubmit={handleConfirmGoogleCode} className="space-y-4 animate-in fade-in">
                                <div className="text-center mb-4">
                                    <img src={pendingGoogleUser.photoURL} alt="Perfil" className="w-16 h-16 rounded-full mx-auto border-2 border-rose-500 mb-2"/>
                                    <p className="text-slate-800 text-sm">Olá, <span className="font-bold">{pendingGoogleUser.displayName}</span>!</p>
                                    <p className="text-slate-500 text-xs mt-1">Defina seu código de vendedor (ID):</p>
                                </div>
                                <div className="relative"><div className="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-400"><IconUser/></div><input type="text" value={googleCode} onChange={e => setGoogleCode(e.target.value)} disabled={isLoading} className="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-rose-500 outline-none text-sm" required placeholder="Seu Código Único (Ex: 99206)"/></div>
                                <button type="submit" disabled={isLoading} className="w-full bg-rose-700 hover:bg-rose-800 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all flex justify-center">{isLoading ? <div className="h-5 w-5"><IconLoader2/></div> : 'Finalizar Cadastro'}</button>
                            </form>
                        ) : !isRegistering ? (
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div className="relative"><div className="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-400"><IconUser/></div><input type="text" value={loginCode} onChange={e => setLoginCode(e.target.value)} disabled={isLoading} className="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-rose-500 outline-none text-sm" required placeholder="Seu Código de Vendedor"/></div>
                                <div className="relative"><div className="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-400"><IconLock/></div><input type="password" value={password} onChange={e => setPassword(e.target.value)} disabled={isLoading} className="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-rose-500 outline-none text-sm" required placeholder="Sua Senha"/></div>
                                <button type="submit" disabled={isLoading} className="w-full bg-rose-700 hover:bg-rose-800 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all flex justify-center">{isLoading ? <div className="h-5 w-5"><IconLoader2/></div> : 'Entrar no Sistema'}</button>
                                <div className="relative flex py-2 items-center"><div className="flex-grow border-t border-slate-300"></div><span className="flex-shrink-0 mx-4 text-slate-400 text-xs font-medium">OU</span><div className="flex-grow border-t border-slate-300"></div></div>
                                <button type="button" onClick={handleGoogleLoginOnly} disabled={isLoading} className="w-full bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-bold py-3 rounded-xl shadow-sm transition-all flex items-center justify-center gap-2 text-sm"><div className="h-5 w-5"><IconGoogle/></div> Entrar com Google</button>
                                <div className="text-center mt-4"><button type="button" onClick={() => setIsRegistering(true)} disabled={isLoading} className="text-sm font-bold text-slate-600 hover:text-rose-700 transition-colors">Não possui acesso? <span className="underline">Cadastrar</span></button></div>
                            </form>
                        ) : (
                            <form onSubmit={handleRegister} className="space-y-3">

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file || file.type !== 'application/pdf') { showMessage('Selecione um PDF válido.', 'error'); return; }
                setIsLoading(true);
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let extractedProducts = [];
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const linesMap = new Map();
                        textContent.items.forEach(item => {
                            const y = Math.round(item.transform[5] / 4) * 4; 
                            if (!linesMap.has(y)) linesMap.set(y, []); linesMap.get(y).push(item);
                        });
                        const sortedY = Array.from(linesMap.keys()).sort((a, b) => b - a);
                        sortedY.forEach(y => {
                            const lineItems = linesMap.get(y).sort((a, b) => a.transform[4] - b.transform[4]);
                            const lineText = lineItems.map(item => item.str).join(' ').replace(/\s+/g, ' ').trim();
                            const match = lineText.match(/(?:^|\s)(\d{4,7})\s+([A-Z0-9ÇÃÕÁÉÍÓÚÂÊÔ].*)/i);
                            if (match) {
                                const code = match[1]; let rest = match[2].trim(); let rawPriceStr = null;
                                rest = rest.replace(/\s+Kg\s*\[L\].*$/i, '').replace(/(?:\s+\d{1,5}[.,]\d{2}){2,}.*$/g, '').replace(/\s+(?:UN|KG|CX|PC|PCT|BD|PLT|FD|KL|KIL|L|K|KgL|Ke|IN|F|Th|M|\[L\])\s*$/gi, '').replace(/[-—.,]+\s*$/, '').trim();
                                const priceMatches = [...rest.matchAll(/(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2}|\d+\.\d{2})/g)];
                                if (priceMatches.length > 0) { rawPriceStr = priceMatches[priceMatches.length - 1][1]; const lastPrice = priceMatches[priceMatches.length - 1][0]; const lastIndex = rest.lastIndexOf(lastPrice); if(lastIndex !== -1) rest = rest.substring(0, lastIndex); }
                                const rawPrice = parsePrice(rawPriceStr);
                                const { hasDiscount, unitFinalPrice } = checkDiscountRules(code, rest, rawPrice);
                                extractedProducts.push({ code, name: rest, originalPrice: rawPrice, discountedPrice: unitFinalPrice });
                            }
                        });

                if (!orderText.trim()) { showMessage('Cole o texto.', 'error'); return; }
                try {
                    let customerName = '', spamov = '';
                    const spMatch = orderText.match(/SPAmov[:\-\s]*(\d+)/i); if (spMatch) spamov = spMatch[1];

        // CLIENTS SCREEN (CRM - Salvando no Firestore)
        const LikertScale = ({ question, value, onChange }) => (
            <div className="mb-4 bg-white p-4 rounded-xl border border-slate-200 hover:border-rose-300 transition-colors shadow-sm"><p className="font-semibold text-slate-700 mb-3 text-sm">{question}</p><div className="flex items-center justify-between gap-2"><span className="text-[10px] sm:text-xs text-slate-400 font-bold uppercase">1 - Não</span><div className="flex gap-1.5 sm:gap-3">{[1, 2, 3, 4, 5].map(num => (<button key={num} type="button" onClick={() => onChange(num)} className={`w-8 h-8 sm:w-10 sm:h-10 rounded-full flex items-center justify-center font-bold text-xs sm:text-sm transition-all border-2 ${value === num ? 'bg-rose-700 border-rose-700 text-white shadow-md transform scale-110' : 'bg-slate-50 border-slate-300 text-slate-500 hover:border-rose-400 hover:bg-rose-50'}`}>{num}</button>))}</div><span className="text-[10px] sm:text-xs text-slate-400 font-bold uppercase">5 - Sim</span></div></div>
        );

        const ClientsScreen = ({ showMessage }) => {
            const [clients, setClients] = useState([]);
            const [isAdding, setIsAdding] = useState(false);
            
            useEffect(() => {
                const unsubscribe = db.collection('clients').onSnapshot(snap => setClients(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
                return () => unsubscribe();
            }, []);
            
            const questionsDefinition = [{ id: 'q1', text: '1. Possui açougue interno e desossa carnes?' }, { id: 'q2', text: '2. Compra peças inteiras no osso (Dianteiro/Banda)?' }, { id: 'q3', text: '3. Prefere caixarias já limpas/porcionadas?' }, { id: 'q4', text: '4. Alta demanda por carnes resfriadas (não congeladas)?' }, { id: 'q5', text: '5. Possui setor de frios fatiados na hora?' }, { id: 'q6', text: '6. Compra grande volume de embutidos (Mortadela)?' }, { id: 'q7', text: '7. Serve refeições prontas (Restaurante)?' }, { id: 'q8', text: '8. Preferência por laticínios (Mussarela, Prato)?' }, { id: 'q9', text: '9. Fatia bifes para exposição em balcão?' }, { id: 'q10', text: '10. Busca padronização extrema nos cortes?' }, { id: 'q11', text: '11. Processa carne moída no estabelecimento?' }, { id: 'q12', text: '12. Possui câmara fria para estocagem?' }, { id: 'q13', text: '13. Preferência por produtos de giro rápido/validade curta?' }, { id: 'q14', text: '14. Compra complementos (Pão de alho, Batata)?' }, { id: 'q15', text: '15. Variedade grande de itens (mix amplo)?' }, { id: 'q16', text: '16. Concentra pedidos em poucos itens de volume altíssimo?' }, { id: 'q17', text: '17. Forte foco em churrasco (Picanha, Costela)?' }, { id: 'q18', text: '18. Demanda constante por miúdos/ossos?' }, { id: 'q19', text: '19. Decide compra baseado no menor preço?' }, { id: 'q20', text: '20. Exige marcas específicas para prateleira?' }];
            const initialFormState = { name: '', phone: '', code: '', address: '' }; questionsDefinition.forEach(q => initialFormState[q.id] = 0);
            const [formData, setFormData] = useState(initialFormState);

            const calculateClientProfile = (data) => {
                const acougueScore = data.q1 + data.q2 + data.q4 + data.q9 + data.q11 + data.q18; const mercadoScore = data.q5 + data.q6 + data.q8 + data.q12 + data.q13 + data.q15 + data.q20; const restauranteScore = data.q3 + data.q7 + data.q10 + data.q14 + data.q16;
                const pAcougue = acougueScore / 30, pMercado = mercadoScore / 35, pRestaurante = restauranteScore / 25; const maxScore = Math.max(pAcougue, pMercado, pRestaurante);
                if (maxScore === 0) return { title: "Cadastro Inicial", color: "bg-slate-100 text-slate-600" };
                if (maxScore === pAcougue) return { title: data.q2 >= 4 ? "Açougue Bruto (Osso)" : "Açougue Padrão", color: "bg-red-100 text-red-800" };
                if (maxScore === pMercado) return { title: "Mercado / Mercearia", color: "bg-blue-100 text-blue-800" };
                return { title: "Restaurante / Food Service", color: "bg-orange-100 text-orange-800" };
            };

            const handleSave = async (e) => {
                e.preventDefault();
                if(questionsDefinition.filter(q => formData[q.id] > 0).length < 5) { showMessage("Responda pelo menos 5 perguntas para a IA funcionar.", 'error'); return; }
                const profileData = calculateClientProfile(formData);
                try { await db.collection('clients').add({ ...formData, profile: profileData }); showMessage("Cliente salvo na nuvem!", 'success'); setIsAdding(false); setFormData(initialFormState); } catch(err) { showMessage("Erro ao salvar cliente", 'error'); }
            };

            if (isAdding) return (
                <div className="animate-in fade-in">
                    <div className="flex justify-between items-center mb-6"><h2 className="text-2xl font-bold text-slate-800">Novo Cliente Inteligente</h2><button onClick={() => setIsAdding(false)} className="text-slate-500 font-medium px-4 py-2 bg-slate-200 rounded-lg">Voltar</button></div>
                    <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6"><form onSubmit={handleSave}><div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8"><div><label className="block text-xs font-bold text-slate-500 mb-1">Nome Fantasia</label><input type="text" required value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full p-3 bg-slate-50 border rounded-lg"/></div><div><label className="block text-xs font-bold text-slate-500 mb-1">Código SPAmov</label><input type="text" required value={formData.code} onChange={e=>setFormData({...formData, code: e.target.value})} className="w-full p-3 bg-slate-50 border rounded-lg"/></div><div><label className="block text-xs font-bold text-slate-500 mb-1">Telefone</label><input type="text" required value={formData.phone} onChange={e=>setFormData({...formData, phone: e.target.value})} className="w-full p-3 bg-slate-50 border rounded-lg"/></div><div><label className="block text-xs font-bold text-slate-500 mb-1">Endereço</label><input type="text" required value={formData.address} onChange={e=>setFormData({...formData, address: e.target.value})} className="w-full p-3 bg-slate-50 border rounded-lg"/></div></div><div className="bg-rose-50 rounded-xl p-4 mb-6 border border-rose-100"><h3 className="text-lg font-bold text-rose-800">Mapeamento de Perfil (IA)</h3></div><div className="grid grid-cols-1 xl:grid-cols-2 gap-x-6">{questionsDefinition.map((q) => (<LikertScale key={q.id} question={q.text} value={formData[q.id]} onChange={(val) => setFormData({...formData, [q.id]: val})} />))}</div><div className="mt-8 flex justify-end"><button type="submit" className="bg-rose-700 text-white font-bold py-4 px-10 rounded-xl shadow-lg">Salvar Cliente</button></div></form></div>
                </div>
            );

            return (
                <div className="animate-in fade-in">
                    <div className="flex justify-between items-center mb-6"><div><h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2"><div className="h-6 w-6 text-rose-700"><IconUsers/></div>CRM & Rotas</h2><p className="text-slate-500 text-sm">Sincronizado na Nuvem</p></div><button onClick={() => setIsAdding(true)} className="bg-rose-700 text-white font-bold py-2.5 px-5 rounded-xl shadow-md flex items-center gap-2"><div className="h-5 w-5"><IconPlus/></div> Novo</button></div>
                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">{clients.map(c => (<div key={c.id} className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 relative overflow-hidden flex flex-col"><div className="absolute top-0 left-0 w-2 h-full bg-rose-700"></div><div className="ml-2 flex-1"><h4 className="font-bold text-lg text-slate-800 mb-2">{c.name}</h4><span className={`inline-block px-3 py-1 rounded-full text-xs font-bold mb-4 ${c.profile?.color}`}>{c.profile?.title}</span><div className="space-y-2 text-sm text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100"><p><b>SPA:</b> {c.code}</p><p><b>TEL:</b> {c.phone}</p><p className="truncate"><b>END:</b> {c.address}</p></div></div></div>))}</div>
                </div>
            );
        };

        // SUPPORT & CREDITS
        const SupportScreen = ({ user }) => (
            <div className="animate-in fade-in max-w-3xl mx-auto"><div className="text-center mb-8"><div className="h-16 w-16 bg-rose-100 text-rose-700 rounded-full flex items-center justify-center mx-auto mb-4"><div className="h-8 w-8"><IconSupport/></div></div><h2 className="text-3xl font-bold text-slate-800">Suporte Técnico</h2></div><div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-8"><form className="space-y-6"><div className="grid grid-cols-1 md:grid-cols-2 gap-6"><div><label className="block text-sm font-bold text-slate-700 mb-1">Solicitante</label><input type="text" value={user.name} disabled className="w-full p-3 bg-slate-100 rounded-xl"/></div><div><label className="block text-sm font-bold text-slate-700 mb-1">E-mail</label><input type="email" value={user.email} disabled className="w-full p-3 bg-slate-100 rounded-xl"/></div></div><div><label className="block text-sm font-bold text-slate-700 mb-1">Assunto</label><select className="w-full p-3 bg-slate-50 border rounded-xl"><option>Reportar Erro</option><option>Dúvida</option></select></div><button type="button" className="w-full bg-rose-700 text-white font-bold py-4 rounded-xl shadow-lg">Enviar Chamado</button></form></div></div>
        );
        const CreditsScreen = () => (
            <div className="animate-in fade-in flex items-center justify-center min-h-[70vh]"><div className="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden max-w-lg w-full text-center relative"><div className="h-32 bg-slate-900 relative overflow-hidden"><img src="image_c2642f.jpg" className="absolute inset-0 w-full h-full object-cover opacity-30 mix-blend-overlay" /></div><div className="px-8 pb-8 relative"><div className="w-24 h-24 bg-white rounded-2xl shadow-lg border-4 border-white mx-auto -mt-12 mb-4 overflow-hidden relative z-10 flex items-center justify-center"><img src="image_c26485.png" alt="Friganso" className="w-16 h-16 object-contain" /></div><h2 className="text-2xl font-black text-slate-800 mb-1">Sistema Friganso Premium ERP</h2><p className="text-slate-500 font-medium mb-6">Versão Cloud - Inteligência & CRM</p><div className="bg-slate-50 rounded-2xl p-6 border border-slate-100 text-left mb-6"><p className="text-sm text-slate-500 mb-1 uppercase tracking-wider font-bold">Desenvolvedor</p><p className="text-lg font-bold text-rose-800 mb-4">Bruno Moura</p><p className="text-sm text-slate-500 mb-1 uppercase tracking-wider font-bold">Contato Direto</p><a href="mailto:bruno.moura.f.silva@gmail.com" className="text-blue-600 font-medium flex items-center gap-2"><div className="h-4 w-4"><IconMail/></div> bruno.moura.f.silva@gmail.com</a></div></div></div></div>
        );

        const App = () => {
            const [user, setUser] = useState(() => { const s = window.localStorage.getItem('friganso_loggedUser'); return s ? JSON.parse(s) : null; });
            const [activeRoute, setActiveRoute] = useState('dashboard');
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [messageBox, setMessageBox] = useState(null);
            const [products, setProducts] = useState([]);

            const handleSetUser = (userData) => {
                if (userData) window.localStorage.setItem('friganso_loggedUser', JSON.stringify(userData));
                else { window.localStorage.removeItem('friganso_loggedUser'); auth.signOut(); }
                setUser(userData);
            };

            const showMessage = (message, type = 'info') => setMessageBox({ message, type });

            if (!user) {
                return (
                    <>
                        <LoginScreen onLogin={handleSetUser} showMessage={showMessage} />
                        {messageBox && <CustomMessageBox {...messageBox} onClose={() => setMessageBox(null)} />}
                    </>
                );
            }

            const renderContent = () => {
                switch(activeRoute) {
                    case 'dashboard': return <DashboardScreen user={user} />;
                    case 'clients': return <ClientsScreen showMessage={showMessage} />;
                    case 'support': return <SupportScreen user={user} />;
                    case 'credits': return <CreditsScreen />;
                    case 'profile': return <ProfileAdminScreen user={user} showMessage={showMessage} />;
                    case 'pdf': return <PdfScreen products={products} setProducts={setProducts} showMessage={showMessage} />;
                    case 'resumo': return <ResumoScreen products={products} showMessage={showMessage} />;
                    case 'orcamentos': return <OrcamentosScreen products={products} showMessage={showMessage} />;
                    default: return <DashboardScreen user={user} />;
                }
            };

            const NavButton = ({ route, icon: Icon, label }) => (
                <button onClick={() => { setActiveRoute(route); setIsSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold transition-all duration-200 ${activeRoute === route ? 'bg-rose-800 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'}`}>
                    <div className="h-5 w-5"><Icon /></div> {label}
                </button>
            );

            return (
                <div className="flex h-screen bg-slate-50 overflow-hidden font-sans">
                    {messageBox && <CustomMessageBox {...messageBox} onClose={() => setMessageBox(null)} />}

                    <button className="md:hidden fixed top-4 left-4 z-50 p-2 bg-slate-900 text-white rounded-lg shadow-lg" onClick={() => setIsSidebarOpen(!isSidebarOpen)}>
                        <div className="h-6 w-6"><IconMenu/></div>
                    </button>

                    <div className={`fixed inset-y-0 left-0 z-40 w-72 bg-slate-950 text-slate-300 transform transition-transform duration-300 ease-in-out flex flex-col ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 md:static border-r border-slate-800 shadow-2xl`}>
                        <div className="p-6 border-b border-slate-800 flex items-center gap-4 bg-slate-900/50">
                            <img src="image_c26485.png" alt="Logo" className="h-12 w-12 rounded-xl bg-black/50 p-1.5 shadow-inner border border-slate-700" />
                            <div>
                                <h1 className="text-xl font-black text-white tracking-tight">FRIGANSO</h1>
                                <p className="text-[10px] text-rose-500 tracking-widest uppercase font-bold">Premium ERP</p>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-1">
                            <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 mt-2 ml-2">Gestão Principal</p>
                            <NavButton route="dashboard" icon={IconDashboard} label="Painel (Dashboard)" />
                            <NavButton route="clients" icon={IconUsers} label="CRM & Rotas" />
                            <NavButton route="profile" icon={IconSettings} label="Meu Perfil / Admin" />
                            
                            <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 mt-8 ml-2">Vendas Diárias</p>
                            <NavButton route="pdf" icon={IconFileText} label="Tabela do Dia (PDF)" />
                            <NavButton route="resumo" icon={IconReceipt} label="Calculadora de Pedidos" />
                            <NavButton route="orcamentos" icon={IconWhatsApp} label="Gerador de Zap" />
                            
                            <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 mt-8 ml-2">Sistema & Ajuda</p>
                            <NavButton route="support" icon={IconSupport} label="Suporte Técnico" />
                            <NavButton route="credits" icon={IconCode} label="Desenvolvedor" />
                        </div>

                        <div className="p-4 border-t border-slate-800 bg-slate-900/50">
                            <div className="p-3 rounded-xl mb-2 flex items-center gap-3 bg-slate-900 border border-slate-800 cursor-pointer hover:border-rose-700/50 transition-colors" onClick={() => setActiveRoute('profile')}>
                                <div className="h-10 w-10 rounded-xl bg-rose-800 text-white flex items-center justify-center font-bold text-sm shadow-md overflow-hidden">
                                    {user.avatar ? <img src={user.avatar} className="w-full h-full object-cover"/> : user.name.charAt(0)}
                                </div>
                                <div className="flex-1 overflow-hidden">
                                    <p className="text-sm font-bold text-white truncate">{user.name}</p>
                                    <p className="text-[10px] text-slate-400 truncate uppercase tracking-wider font-bold">ID: {user.code} • {user.role}</p>
                                </div>
                            </div>
                            <button onClick={() => handleSetUser(null)} className="w-full flex items-center justify-center gap-2 px-4 py-3 text-sm font-bold text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition-colors">
                                <div className="h-4 w-4"><IconLogOut/></div> Sair da Conta
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto relative z-0 p-4 pt-20 md:p-8 bg-slate-100">
                        <div className="absolute inset-0 pointer-events-none opacity-[0.02] bg-[url('https://images.unsplash.com/photo-1607623814075-e51df1bd682f?q=80&w=2000')] bg-cover bg-center"></div>
                        <div className="relative z-10 max-w-7xl mx-auto">
                            {renderContent()}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
